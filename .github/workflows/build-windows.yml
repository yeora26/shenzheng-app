name: 构建 Windows EXE

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: 构建 Windows 安装包与单文件
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: 'utf-8'
      PYTHONUTF8: '1'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装 Python 构建依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller fastapi uvicorn httpx pydantic

      - name: 编译 Python 后端 Sidecar 二进制
        run: python build-sidecar.py

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 安装 Rust 稳定版工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust 构建缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 安装前端依赖
        run: npm install

      - name: 构建静态前端
        run: npm run build

      - name: 构建 Tauri Windows 应用
        run: npx tauri build

      - name: 上传构建产物 (EXE) 到 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 前哨人物画像系统-Windows-EXE
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/*.exe
          if-no-files-found: error
          retention-days: 14
