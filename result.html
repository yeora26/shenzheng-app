<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>政审分析报告</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/result.css" />
</head>
<body class="report-page">
  <header class="header">
    <button id="btnBack" class="icon-btn" type="button" title="返回" aria-label="返回">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
        stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>
    <div class="brand">
      <svg class="brand-logo" viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
        <path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3z" />
      </svg>
      <div class="header-text">
        <h1>政审分析报告</h1>
        <p class="subtitle" id="metaText"></p>
      </div>
    </div>
    <button id="btnSettings" class="icon-btn" type="button" title="大模型配置" aria-label="大模型配置">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
        stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
  </header>

  <main class="report">
    <div id="reportLoading" class="empty">
      <div class="spinner"></div>
      <p>正在调用大模型生成政审分析报告…</p>
    </div>

    <div id="reportError" class="empty hidden">
      <p class="error-text" id="errorText"></p>
      <div class="error-actions">
        <button id="btnRetry" class="btn ghost small" type="button">重试</button>
        <button id="btnOpenSettings2" class="btn primary small" type="button">配置大模型</button>
      </div>
    </div>

    <div id="reportBody" class="hidden">
      <section class="hero card">
        <div class="hero-left">
          <span class="hero-label">总体风险等级</span>
          <span id="heroRisk" class="big-badge"></span>
        </div>
        <div class="hero-right">
          <p id="heroSummary" class="summary"></p>
          <div class="dist">
            <div id="distBar" class="dist-bar"></div>
            <div id="distLegend" class="dist-legend"></div>
          </div>
        </div>
      </section>

      <section class="grid" id="dimensionGrid"></section>
    </div>
  </main>

  <!-- 设置弹窗 -->
  <div id="settingsModal" class="modal hidden">
    <div class="modal-mask" id="modalMask"></div>
    <div class="modal-card card">
      <div class="modal-head">
        <h2>大模型配置</h2>
        <button id="btnCloseSettings" class="icon-btn" type="button" aria-label="关闭">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <label class="field">
        <span>API 地址</span>
        <input id="cfgBaseUrl" type="text" placeholder="https://api.deepseek.com/v1" />
      </label>
      <label class="field">
        <span>API Key</span>
        <input id="cfgApiKey" type="password" placeholder="sk-..." autocomplete="off" />
      </label>
      <label class="field">
        <span>模型</span>
        <input id="cfgModel" type="text" placeholder="deepseek-chat" />
      </label>
      <p class="hint">配置保存在浏览器本地，兼容任意 OpenAI 格式接口。</p>
      <div class="actions">
        <button id="btnSaveSettings" class="btn primary" type="button">保存</button>
      </div>
    </div>
  </div>

  <footer class="footer">本报告由大模型自动生成，仅供技术演示参考，不构成任何审查结论。</footer>

  <script src="assets/js/shared.js"></script>
  <script src="assets/js/result.js"></script>
</body>
</html>
